services:
  app:
    container_name: office-frontend
    image: ghcr.io/amptechnology-dev/travel:latest
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    expose:
      - "5010"
    networks:
      - shared-nginx-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared-nginx-net:
    external: true
    name: amp_portal_backend_app-network